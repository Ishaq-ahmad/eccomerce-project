<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checkout | MyStore</title>

    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/checkout.css" />
    <link rel="stylesheet" href="./css/footer.css" />
  </head>
  <body>
    <!-- Checkout Header -->

    <div id="navbar"></div>

    <main class="checkout-container">
      <section class="checkout-left">
        <h1>Checkout</h1>
        <p class="checkout-subtitle">
          Complete your information to place your order.
        </p>

        <!-- Contact Information -->
        <div class="checkout-section">
          <h2>01. Contact Information</h2>

          <div class="checkout-field">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="checkout-grid">
            <div class="checkout-field">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                placeholder="example@gmail.com"
                required
              />
            </div>

            <div class="checkout-field">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" placeholder="03XXXXXXXXX" required />
            </div>
          </div>
        </div>

        <!-- Shipping Address -->
        <div class="checkout-section">
          <h2>02. Shipping Address</h2>

          <div class="checkout-field">
            <label for="address">Street Address</label>
            <input
              type="text"
              id="address"
              placeholder="House number, street name"
              required
            />
          </div>

          <div class="checkout-grid">
            <div class="checkout-field">
              <label for="city">City</label>
              <input type="text" id="city" placeholder="Peshawar" required />
            </div>

            <div class="checkout-field">
              <label for="postalCode">Postal Code</label>
              <input type="text" id="postalCode" placeholder="25000" />
            </div>
          </div>

          <div class="checkout-field">
            <label for="instructions">Delivery Instructions (Optional)</label>
            <textarea
              id="instructions"
              placeholder="Any special instructions for delivery?"
              rows="3"
            ></textarea>
          </div>
        </div>

        <!-- Payment Method -->
        <div class="checkout-section">
          <h2>03. Payment Method</h2>

          <label class="payment-option">
            <input type="radio" name="payment" value="cod" checked />

            <div>
              <strong>Cash on Delivery</strong>
              <p>Pay when your order arrives.</p>
            </div>

            <span class="payment-icon">💵</span>
          </label>
        </div>
      </section>

      <!-- Order Summary -->
      <aside class="checkout-right">
        <div class="order-summary">
          <h2>Your Order</h2>

          <!-- Selected Products -->
          <div id="checkoutProducts">
            <!-- All Products appear here from js -->
          </div>

          <div class="summary-divider"></div>

          <div class="summary-row">
            <span>Subtotal</span>
            <span id="checkoutSubtotal">Rs. 0</span>
          </div>

          <div class="summary-row">
            <span>Shipping</span>
            <span id="checkoutShipping">Rs. 0</span>
          </div>

          <div class="summary-row">
            <span>Discount</span>
            <span id="checkoutDiscount">Rs. 0</span>
          </div>

          <div class="summary-divider"></div>

          <div class="summary-row summary-total">
            <strong>Total</strong>
            <strong id="checkoutTotal">Rs. 0</strong>
          </div>

          <button type="button" class="place-order-btn">Place Order</button>

          <p class="secure-message">🔒 Your information is safe and secure.</p>
        </div>
      </aside>
    </main>

    <div id="footer"></div>

    <script src="./js/allProductsArray.js"></script>
    <script src="./js/global.js"></script>
    <script src="./js/checkout.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/footer.js"></script>
  </body>
</html>
